name: Restore required assets
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-required-assets.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original binary assets
        shell: bash
        run: |
          set -euo pipefail
          cat .restore/chunk_* | tr -d '\n' | base64 -d > /tmp/restore4.tar.xz
          xz -t /tmp/restore4.tar.xz
          tar -xJf /tmp/restore4.tar.xz -C assets

          test -f assets/nexa-mark.png
          test -f assets/portfolio-1.webp
          test -f assets/portfolio-2.webp
          test -f assets/portfolio-3.webp

          rm -rf .restore
          rm -f .github/workflows/restore-required-assets.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore required site assets"
          git push origin HEAD:main
