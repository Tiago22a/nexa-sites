name: Apply SEO site update

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-seo-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild clean repository tree
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/keep/assets/portfolio /tmp/keep/favicons
          cp assets/portfolio/douglassilva.png /tmp/keep/assets/portfolio/
          cp assets/portfolio/emergy5.png /tmp/keep/assets/portfolio/
          cp assets/portfolio/escolaeterna.png /tmp/keep/assets/portfolio/
          cp assets/portfolio/winfascend.png /tmp/keep/assets/portfolio/
          cp favicons/2-removebg-preview.png /tmp/keep/favicons/

          cat .deploy/chunk_* | base64 -d > /tmp/nexa-text.tar.gz
          gzip -t /tmp/nexa-text.tar.gz

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.deploy' ! -name '.github' -exec rm -rf {} +

          mkdir -p assets/portfolio favicons
          cp /tmp/keep/assets/portfolio/* assets/portfolio/
          cp /tmp/keep/favicons/* favicons/
          tar -xzf /tmp/nexa-text.tar.gz -C .

          test -f index.html
          test -f robots.txt
          test -f sitemap.xml
          test -f criacao-de-sites/index.html
          test -f site-para-dentista-com-agendamento/index.html

          rm -rf .deploy
          rm -f .github/workflows/apply-seo-update.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "SEO: replace site with optimized structure"
          git push origin HEAD:main

# trigger
